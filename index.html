<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alan Rynne Adventure | Retro Game Portfolio</title>
  <meta name="description" content="Discover Alan Rynne's story through a retro Game Boy style adventure">
  <meta name="keywords" content="Alan Rynne, software engineer, CAD specialist, retro game, portfolio">
  <link rel="stylesheet" href="./css/retro-game.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E88D8KMDY9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());

  gtag('config', 'G-E88D8KMDY9');
</script>

<body class="retro-body">
  <div id="gameContainer" class="game-container">
    <!-- Retro CRT Effect Overlay -->
    <div class="crt-overlay"></div>
    
    <!-- Game Screen -->
    <div class="game-screen">
      <canvas id="gameCanvas" class="game-canvas"></canvas>
    </div>
    
    <!-- Game Boy Style Controls Info -->
    <div class="controls-info">
      <div class="control-item">
        <span class="key">WASD</span> or <span class="key">↑↓←→</span> Move
      </div>
      <div class="control-item">
        <span class="key">SPACE</span> Action/Start
      </div>
      <div class="control-item">
        <span class="key">ESC</span> Pause
      </div>
    </div>
    
    <!-- Social Links (Game Boy Style) -->
    <div class="social-links">
      <a href="https://github.com/alanrynne" class="retro-link" target="_blank">
        <span class="link-icon">⚡</span> GitHub
      </a>
      <a href="https://linkedin.com/in/alanrynne" class="retro-link" target="_blank">
        <span class="link-icon">💼</span> LinkedIn
      </a>
    </div>
    
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-title">ALAN RYNNE</div>
        <div class="loading-subtitle">ADVENTURE</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Game Engine -->
  <script src="./js/game.js"></script>
</body>

</html>
